<h1 id="contact-title">Start your delivery</h1>
<p>Tell us where you are and we will reply within one day. All fields are required.</p>
<form id="contact-form" action="mailto:hello@puredrop.example" method="post" enctype="text/plain" novalidate>
 <div>
  <label for="name">Name</label>
  <input id="name" name="name" type="text" required minlength="2" autocomplete="name" aria-describedby="name-err">
  <span class="err" id="name-err" aria-live="polite"></span>
 </div>
 <div>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="email" aria-describedby="email-hint email-err">
  <span class="hint" id="email-hint">We only use this to reply to you.</span>
  <span class="err" id="email-err" aria-live="polite"></span>
 </div>
 <div>
  <label for="message">Message</label>
  <textarea id="message" name="message" required minlength="10" aria-describedby="message-err"></textarea>
  <span class="err" id="message-err" aria-live="polite"></span>
 </div>
 <div><button class="btn" type="submit">Send message</button></div>
 <p id="form-status" role="status" class="form-status"></p>
</form>
